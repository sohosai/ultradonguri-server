basePath: /
definitions:
  requests.CMStateRequest:
    properties:
      is_cm_mode:
        description: binding:"required"の影響でfalseを渡したときにエラーが出るので、bool型ではなくポインタを渡す
        type: boolean
    required:
    - is_cm_mode
    type: object
  responses.ErrorResponse:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  responses.Result:
    properties:
      operation:
        type: string
      success:
        type: boolean
    type: object
  responses.SuccessResponse:
    properties:
      message:
        type: string
      results:
        items:
          $ref: '#/definitions/responses.Result'
        type: array
    type: object
info:
  contact: {}
  title: Ultradonguri API
  version: "0.1"
paths:
  /burari-scene:
    post:
      consumes:
      - application/json
      description: endpoint for change OBS scene to burari-travel
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: change to burari scene
      tags:
      - scene
  /cm-scene:
    post:
      consumes:
      - application/json
      description: endpoint for change OBS scene to cm
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: change to cm scene
      tags:
      - scene
  /conversion/cm-mode:
    post:
      consumes:
      - application/json
      description: endpoint for conversion to cm-mode
      parameters:
      - description: post CM request
        in: body
        name: CMStateStart
        required: true
        schema:
          $ref: '#/definitions/requests.CMStateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: conversion cm-mode
      tags:
      - conversion
  /health:
    get:
      description: endpoint for health check
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.SuccessResponse'
      summary: health check
      tags:
      - health
  /normal-scene:
    post:
      consumes:
      - application/json
      description: endpoint for change OBS scene to normal
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: change to normal scene
      tags:
      - scene
swagger: "2.0"
